# Copy to config/paths.yaml and edit, or set the same names (upper-case) as
# environment variables; the environment wins. Relative paths in this file are taken
# relative to the repository root. Run `python -m lob_impact.paths` to see what was resolved.

lob_impact_data:     ./data            # controls/ and grid/ are looked for here

# Uncomment to place one of the two rollout trees somewhere else:
# lob_impact_controls: ./data/controls   # rollouts without a metaorder: free runs, blind arm
# lob_impact_grid:     ./data/grid       # metaorder-injection rollouts: the visible arm

lob_impact_results:  ./results         # where the tools write caches and tables
